[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beauxworks-api"
version = "0.1.0"
description = "BeauxWorks — FastAPI backend for artisan food production management"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "sqlalchemy>=2.0,<3",
    "pyodbc>=5,<6",
    "alembic>=1.13,<2",
    "pydantic-settings>=2,<3",
    "python-jose[cryptography]>=3.3,<4",
    "argon2-cffi>=23,<24",
    "pyotp>=2.9,<3",
    "cryptography>=42,<44",
    "python-multipart>=0.0.7,<1",
    "email-validator>=2,<3",
    "qrcode[pil]>=7.4,<8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "ruff>=0.3,<1",
]
